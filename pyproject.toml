# SERAPHIM — Python backend configuration (S03)
# Backend language: Python (ADR-001 ACCEPTED)
# Production Python version: select from supported stable branches at S03+ build time.
# This file uses the experimental environment version only for lock-file reproducibility.

[project]
name = "seraphim-core"
version = "0.1.0"
description = "SERAPHIM agent runtime — backend core"
requires-python = ">=3.11"
# License not specified for skeleton; add proper SPDX expression at S77.

# --- Production dependencies --------------------------------------------------
dependencies = [
    "click>=8.1.0,<9",
    "pyyaml>=6.0.0,<7",
]

# --- Development dependencies (S03 skeleton only) ----------------------------
[project.optional-dependencies]
dev = [
    "ruff>=0.4.0,<1",
    "pytest>=8.0.0,<9",
]

# --- Ruff configuration -------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = [
    "E",      # pycodestyle errors
    "W",      # pycodestyle warnings
    "F",      # pyflakes
    "I",      # isort
    "UP",     # pyupgrade
    "B",      # flake8-bugbear
    "SIM",    # flake8-simplify
    "RUF",    # ruff rules
]
ignore = [
    "E501",   # line length handled by formatter
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

# --- setuptools package discovery --------------------------------------------
# Explicitly limit to backend/ to avoid "multiple top-level packages" error.
[tool.setuptools.packages.find]
include = ["seraphim*"]
namespaces = false

# --- CLI entry point ----------------------------------------------------------
[project.scripts]
seraphim = "seraphim.cli.main:cli"

# --- pytest configuration -----------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
